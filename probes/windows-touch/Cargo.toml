[package]
name = "touch-probe"
version = "0.2.0"
edition = "2024"
description = "Logs what Windows reports of the pointer and its buttons during taps, for issue #277 of Exile Market. Throwaway: never merged."
license = "GPL-3.0-or-later"
publish = false

# A workspace of its own, outside the one of Exile Market.
[workspace]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
